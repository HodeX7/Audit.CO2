[project]
name = "carbonroom"
version = "0.1.0"
description = "Carbon Room: a month-end emissions close, run from chat (Flip the Switch hackathon)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
carbonroom = "carbonroom.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carbonroom"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/schema.sql" = "carbonroom/_contracts/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
