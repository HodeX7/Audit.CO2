[project]
name = "carbon-room"
version = "0.1.0"
description = "Carbon Room: a month-end emissions close, run from chat (Flip the Switch hackathon)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.scripts]
carbon-room = "carbon_room.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carbon_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
