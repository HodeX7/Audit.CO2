[project]
name = "carbon-room"
version = "0.1.0"
description = "Carbon Room: a month-end emissions close, run from chat (Flip the Switch hackathon)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "websockets>=12",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "neo4j>=6,<7",
]

[project.scripts]
carbonroom = "carbonroom.cli:main"
carbon-room = "carbon_room.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carbonroom", "carbon_room"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/schema.sql" = "carbonroom/_contracts/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
